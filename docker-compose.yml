version: '3.8'
services:
  db:
    image: mysql:8
    container_name: shopizer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopizer
      MYSQL_USER: shopizer
      MYSQL_PASSWORD: shopizer
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  shopizer:
    build:
      context: ./sm-shop
    container_name: shopizer-app
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: shopizer
      DB_USER: shopizer
      DB_PASSWORD: shopizer
      DB_JDBCURL: jdbc:mysql://db:3306/shopizer?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
      SHOPIZER_SEARCH_HOST: opensearch
      SHOPIZER_SEARCH_PORT: 9200
    ports:
      - "8080:8080"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: shopizer-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=ShopizerOpensearch2024!
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data:
  opensearch-data: 